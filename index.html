<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#04070d">
<title>SONAR SNAKE</title>
<style>
  html{height:100%;background:#04070d;text-size-adjust:100%;-webkit-text-size-adjust:100%}
  body{margin:0;position:fixed;inset:0;width:100%;overflow:hidden;background:#04070d;color:#9adcd0;font-family:ui-monospace,Menlo,Consolas,'Courier New',monospace;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;box-sizing:border-box;padding:calc(12px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left))}
  #hud{display:flex;flex-wrap:wrap;gap:14px;align-items:center;font-size:12px;letter-spacing:2px;color:#6fbfb0;text-transform:uppercase}
  #hud b{color:#e8fffa;font-weight:600}
  #hud button{background:#0c1a22;border:1px solid #1d3b45;border-radius:4px;color:#6fbfb0;font:inherit;font-size:11px;letter-spacing:2px;padding:3px 8px;cursor:pointer;text-transform:uppercase}
  #hud button:hover{background:#123240;color:#e8fffa}
  .pingmeter{position:relative;display:inline-flex;align-items:center;gap:6px}
  .pingmeter b{display:inline-flex;gap:5px;align-items:center}
  .pingmeter i{width:11px;height:11px;border-radius:50%;display:block;background:#10262c;box-shadow:inset 0 0 0 1.5px #245e56}
  .pingmeter i.on{background:#8dffe9;box-shadow:0 0 8px #5ef0d4}
  .pingmeter i.spent{animation:pipSpent .42s ease}
  .pingmeter i.recharge{animation:pipReady .7s ease both}
  .pingmeter.fired{color:#f3fffc;text-shadow:0 0 10px #8dffe9}
  .pingmeter.denied{animation:pipDeny .32s ease}
  #pingnote{position:absolute;left:0;top:calc(100% + 1px);font-style:normal;font-size:10px;letter-spacing:2px;color:#d9fff6;opacity:0;white-space:nowrap;pointer-events:none;text-shadow:0 0 8px #04221e}
  #pingnote.show{animation:pingNote .9s ease}
  @keyframes pipSpent{0%{transform:scale(1.9);background:#fff;box-shadow:0 0 16px #fff}100%{transform:scale(1);background:#10262c;box-shadow:inset 0 0 0 1.5px #245e56}}
  @keyframes pipReady{0%{transform:scale(.3);background:#10262c}35%{transform:scale(1.8);background:#fff;box-shadow:0 0 18px #c8fff4}100%{transform:scale(1);background:#8dffe9;box-shadow:0 0 8px #5ef0d4}}
  @keyframes pipDeny{0%,100%{transform:translateX(0)}30%{transform:translateX(-4px)}70%{transform:translateX(4px)}}
  @keyframes pingNote{0%{opacity:0}15%{opacity:1}70%{opacity:1}100%{opacity:0}}
  #stage{position:relative;width:min(84vmin,540px,calc(100svh - 220px))}
  canvas{display:block;box-sizing:border-box;width:100%;height:auto;background:#04070d;border:1px solid #123039;border-radius:6px;touch-action:none;cursor:crosshair}
  #crt{position:absolute;inset:0;pointer-events:none;border-radius:6px;
    background:
      repeating-linear-gradient(0deg, rgba(0,0,0,.15) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.5) 100%)}
  #panel{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(2,6,10,.82);border-radius:6px;z-index:5}
  #panelbox{background:#071019;border:1px solid #1d3b45;border-radius:8px;padding:18px 22px;min-width:290px;max-width:86%;text-align:center;box-shadow:0 0 40px rgba(0,0,0,.6)}
  #panel h2{margin:0 0 10px;font-size:15px;letter-spacing:4px;color:#7fd8c8;font-weight:600}
  #lblist{list-style:none;margin:0 0 12px;padding:0;font-size:13px;text-align:left;max-height:36vh;overflow:auto}
  #lblist li{display:flex;gap:10px;padding:4px 0;color:#cfe8e2;border-bottom:1px solid #0d1c24}
  #lblist .rk{color:#4d8a80;min-width:22px}
  #lblist .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e8fffa}
  #lblist .sc{color:#ffcf6e;min-width:48px;text-align:right}
  #lblist .lv{color:#4d8a80;font-size:11px;padding-top:2px}
  #lform{display:flex;gap:8px;margin:0 0 12px}
  #lname{flex:0 0 5.4em;width:5.4em;min-width:0;background:#0c1a22;border:1px solid #1d3b45;border-radius:4px;color:#e8fffa;padding:7px 0 7px .55em;font-size:22px;font-weight:700;font-family:inherit;letter-spacing:.42em;text-align:center;text-transform:uppercase;outline:none}
  #lname:focus{border-color:#66e6cf}
  #lform button:disabled{opacity:.4;cursor:default}
  #panel button{background:#0c1a22;border:1px solid #2a5b66;border-radius:4px;color:#7fd8c8;font:inherit;letter-spacing:1px;padding:7px 12px;cursor:pointer}
  #panel button:hover{background:#123240;color:#e8fffa}
  #panelbtns{display:flex;gap:8px;justify-content:center}
  [hidden]{display:none!important}
  #adslot{box-sizing:border-box;width:min(84vmin,540px,calc(100svh - 220px));height:60px;flex:0 0 60px;margin-top:10px;border:1px dashed #1d3b45;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#2f5f57;font-size:11px;letter-spacing:2px;text-transform:uppercase;overflow:hidden}
  #stage,#hud,#adslot,#crt{touch-action:none}
  #panel{touch-action:auto}
  #lblist{touch-action:pan-y}
  @media (max-width:600px){
    #hud{gap:8px}
    #hud button{padding:6px 12px;font-size:12px}
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>score <b id="score">0</b></span>
    <span>best <b id="best">0</b></span>
    <span>lvl <b id="level">1</b></span>
    <span id="pingmeter" class="pingmeter">ping <b id="flashdots" aria-label="3 pings ready"><i class="on"></i><i class="on"></i><i class="on"></i></b><em id="pingnote" aria-live="polite"></em></span>
    <button type="button" id="sndbtn">snd on</button>
    <button type="button" id="lbbtn">ranks</button>
  </div>
  <div id="stage">
    <canvas id="cv" width="540" height="540"></canvas>
    <div id="crt"></div>
    <div id="panel" hidden>
      <div id="panelbox">
        <h2>LEADERBOARD</h2>
        <form id="lform" hidden>
          <input id="lname" maxlength="3" minlength="3" placeholder="AAA" autocomplete="off" spellcheck="false" autocapitalize="characters" enterkeyhint="done" aria-label="three character name" inputmode="text">
          <button type="submit">submit</button>
        </form>
        <ol id="lblist"></ol>
        <div id="panelbtns">
          <button type="button" id="pbtnreward" hidden>watch ad · continue</button>
          <button type="button" id="pbtnagain" hidden>play again</button>
          <button type="button" id="pbtnclose">close</button>
        </div>
      </div>
    </div>
  </div>
  <!-- H5 Games Ads are full-screen Ad Placement breaks. This box stays until ADSENSE_CLIENT or ads.config.json has a publisher id. -->
  <div id="adslot"><span>ad slot · paste ad code here once approved</span></div>
</div>
<script>
(()=>{
const COLS=18,ROWS=18,CELL=30;
const VIEW=COLS*CELL;
const U=CELL/24;

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
cv.width=VIEW;cv.height=VIEW;
let cvScale=1;
function updScale(){const w=cv.getBoundingClientRect().width;if(w>0)cvScale=w/VIEW;}
window.addEventListener('resize',updScale);
window.addEventListener('orientationchange',()=>setTimeout(updScale,300));
updScale();
function fs(base){return Math.round(base*Math.min(2,Math.max(1,11.5/(base*cvScale))));}
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),
      levelEl=document.getElementById('level'),flashdots=document.getElementById('flashdots'),
      pingmeter=document.getElementById('pingmeter'),pingnote=document.getElementById('pingnote'),
      panel=document.getElementById('panel'),lform=document.getElementById('lform'),
      lname=document.getElementById('lname'),lblist=document.getElementById('lblist'),
      pbtnagain=document.getElementById('pbtnagain'),pbtnreward=document.getElementById('pbtnreward'),
      pbtnclose=document.getElementById('pbtnclose'),
      sndbtn=document.getElementById('sndbtn'),lbbtn=document.getElementById('lbbtn');

let state='title',grid=null,snake=null,dir={x:1,y:0},dirQueue=[],food=null,pings=[],
    score=0,level=1,foods=0,moveInterval=260,moveAcc=0,flashes=3,flashHold=0,
    tGlobal=0,deathT=0,flashT=0,firePulse=0,pingBanner=null,shakeT=0,shakeMax=1,shakeAmp=0,beaconT=0,muted=false,
    submitted=false,deathPanelShown=false;
let best=Number(localStorage.getItem('sonarsnake_best')||0);
bestEl.textContent=best;

const GAME_VERSION='1.3.0';
function uuid(){return crypto.randomUUID?crypto.randomUUID():'u'+Date.now().toString(36)+Math.random().toString(36).slice(2);}
let cid=localStorage.getItem('ss_cid');
if(!cid){cid=uuid();try{localStorage.setItem('ss_cid',cid);}catch(e){}}
const sid=uuid();
const sessionStartT=Date.now();
const aq=[];
let runCount=0,lastRunEndT=null,runStats=null,leaveTracked=false;
let adsReady=false,adHold=false,adHoldStarted=0,adHoldAccum=0,adBreakBusy=false,rewardGen=0,rewardShow=null;
let adOfferOpen=false,adLeave=null;
function track(name,props){
  aq.push({name,props:props||{},t:Date.now()});
  if(aq.length>=10)flushAnalytics();
}
function flushAnalytics(beacon){
  if(!aq.length)return;
  const body=JSON.stringify({clientId:cid,sessionId:sid,gameVersion:GAME_VERSION,events:aq.splice(0,aq.length)});
  try{
    if(beacon&&navigator.sendBeacon)navigator.sendBeacon('/api/analytics',new Blob([body],{type:'application/json'}));
    else fetch('/api/analytics',{method:'POST',headers:{'Content-Type':'application/json'},body,keepalive:true}).catch(()=>{});
  }catch(e){}
}
function deviceProps(){
  const ua=navigator.userAgent||'';
  const touchPoints=navigator.maxTouchPoints||0;
  const coarse=matchMedia('(pointer:coarse)').matches;
  const fine=matchMedia('(pointer:fine)').matches;
  let pointer='none';
  if(coarse&&fine)pointer='both';
  else if(coarse)pointer='coarse';
  else if(fine)pointer='fine';
  const phone=/Mobi|iPhone|iPod|Android.+Mobile|Windows Phone/i.test(ua);
  const tablet=/iPad|Tablet|PlayBook|Silk/i.test(ua)||(/Android/i.test(ua)&&!/Mobile/i.test(ua))||(/Macintosh/i.test(ua)&&touchPoints>1);
  return {
    touch:coarse,pointer,touchPoints,
    dpr:Math.round((window.devicePixelRatio||1)*100)/100,
    vw:innerWidth,vh:innerHeight,sw:screen.width||0,sh:screen.height||0,
    form:phone?'phone':tablet?'tablet':'desktop',
    lang:(navigator.language||'').slice(0,8)
  };
}
function noteSession(reason){
  if(leaveTracked)return;
  const now=Date.now();
  const durationMs=Math.max(0,now-sessionStartT);
  let runMs=null;
  if(runStats&&runStats.startT&&state!=='title'){
    const end=state==='playing'?now:(lastRunEndT||now);
    runMs=Math.max(0,end-runStats.startT-adHoldAccum);
  }
  const duringAd=!!(adLeave&&adLeave.phase==='during');
  const afterAd=!!(adLeave&&adLeave.phase==='after');
  leaveTracked=true;
  if(adOfferOpen&&!duringAd){
    adOfferOpen=false;
    rewardShow=null;
    pbtnreward.hidden=true;
    track('ad_dismiss',{breakType:'reward',breakName:'continue-run',reason:'left'});
  }
  if(adLeave){
    track('ad_leave',{
      when:adLeave.phase,breakType:adLeave.breakType,breakName:adLeave.breakName,
      sinceAdMs:Math.max(0,now-adLeave.at),startedRun:false,reason
    });
    adLeave=null;
  }
  track('abandon',{
    location:state,panel:!panel.hidden,durationMs,runMs,
    level:state==='title'?0:level,score:state==='title'?0:score,reason,
    duringAd,afterAd
  });
  track('session_end',{durationMs,location:state,runs:runCount,reason,duringAd,afterAd});
}
function sessionPing(){
  if(leaveTracked)return;
  track('session_ping',{durationMs:Math.max(0,Date.now()-sessionStartT),location:state});
}
setInterval(()=>flushAnalytics(),15000);
setInterval(sessionPing,30000);
window.addEventListener('pagehide',()=>{noteSession('pagehide');flushAnalytics(true);});
window.addEventListener('pageshow',e=>{if(e.persisted)leaveTracked=false;});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){sessionPing();flushAnalytics(true);}
});
track('session_start',{});
track('load',deviceProps());

function normalizeAds(raw){
  if(!raw||typeof raw!=='object')return {enabled:false};
  const client=String(raw.client||'').trim();
  if(!/^ca-pub-\d{10,22}$/.test(client))return {enabled:false};
  const cfg={
    enabled:true,client,
    frequencyHint:/^\d{1,4}s$/.test(String(raw.frequencyHint||'').trim())?String(raw.frequencyHint).trim():'120s',
    test:raw.test===true||raw.test==='on'||raw.test==='1'||raw.test==='true'
  };
  const channel=String(raw.channel||'').trim();
  const host=String(raw.host||'').trim();
  if(/^\d{1,20}$/.test(channel))cfg.channel=channel;
  if(/^ca-host-pub-\d{1,22}$/.test(host))cfg.host=host;
  return cfg;
}
function syncAdSound(){
  if(typeof window.adConfig==='function')window.adConfig({sound:muted?'off':'on'});
}
function beginAdHold(type,name){
  if(adHold)return;
  adHold=true;
  adHoldStarted=Date.now();
  adLeave={phase:'during',breakType:type||'',breakName:name||'',at:Date.now()};
}
function clearAdLeave(){adLeave=null;}
function finishShownAd(){
  if(!adLeave||adLeave.phase!=='during')return;
  if(state==='playing'){adLeave=null;return;}
  adLeave.phase='after';
  adLeave.at=Date.now();
}
function declineRewardOffer(reason){
  if(!adOfferOpen)return;
  adOfferOpen=false;
  rewardShow=null;
  pbtnreward.hidden=true;
  track('ad_dismiss',{breakType:'reward',breakName:'continue-run',reason:reason||'skipped'});
}
function acceptReward(){
  const show=rewardShow;
  rewardShow=null;
  pbtnreward.hidden=true;
  if(!show)return;
  adOfferOpen=false;
  track('ad_accept',{breakType:'reward',breakName:'continue-run'});
  show();
}
function endAdHold(){
  if(!adHold)return;
  if(adHoldStarted)adHoldAccum+=Date.now()-adHoldStarted;
  adHold=false;
  adHoldStarted=0;
}
function placementProps(info,type,name){
  const g=(v,n)=>String(v==null?'':v).slice(0,n);
  return {
    breakType:g(info&&info.breakType||type,24),
    breakName:g(info&&info.breakName||name,40),
    breakFormat:g(info&&info.breakFormat,24),
    breakStatus:g(info&&info.breakStatus,32)
  };
}
function armAds(cfg){
  window.adsbygoogle=window.adsbygoogle||[];
  window.adBreak=window.adConfig=function(o){window.adsbygoogle.push(o);};
  window.adConfig({
    preloadAdBreaks:'on',
    sound:muted?'off':'on',
    onReady:()=>{
      adsReady=true;
      if(state==='dead')offerContinueAd();
    }
  });
  const s=document.createElement('script');
  s.async=true;
  s.crossOrigin='anonymous';
  s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client='+encodeURIComponent(cfg.client);
  s.setAttribute('data-ad-client',cfg.client);
  if(cfg.channel)s.setAttribute('data-ad-channel',cfg.channel);
  if(cfg.host)s.setAttribute('data-ad-host',cfg.host);
  if(cfg.frequencyHint)s.setAttribute('data-ad-frequency-hint',cfg.frequencyHint);
  if(cfg.test)s.setAttribute('data-adbreak-test','on');
  document.head.appendChild(s);
  const slot=document.getElementById('adslot');
  if(slot)slot.hidden=true;
}
async function initAds(){
  let cfg={enabled:false};
  try{
    const r=await fetch('/api/ads-config',{cache:'no-store'});
    if(r.ok)cfg=normalizeAds(await r.json());
  }catch(e){}
  if(!cfg.enabled){
    try{
      const r=await fetch('/ads.config.json',{cache:'no-store'});
      if(r.ok)cfg=normalizeAds(await r.json());
    }catch(e){}
  }
  if(cfg.enabled)armAds(cfg);
}
initAds();
function offerContinueAd(){
  if(!adsReady||adBreakBusy||adHold||state!=='dead'||score<=0||typeof window.adBreak!=='function')return;
  const gen=rewardGen;
  adBreakBusy=true;
  try{
    window.adBreak({
      type:'reward',
      name:'continue-run',
      beforeReward:(showAdFn)=>{
        if(gen!==rewardGen||state!=='dead'||score<=0)return;
        rewardShow=()=>{showAdFn();};
        pbtnreward.hidden=false;
        if(!adOfferOpen){
          adOfferOpen=true;
          track('ad_offer',{breakType:'reward',breakName:'continue-run'});
        }
      },
      beforeAd:()=>{
        if(gen!==rewardGen)return;
        beginAdHold('reward','continue-run');
        track('before_ad',{breakType:'reward',breakName:'continue-run'});
      },
      adDismissed:()=>{
        if(gen!==rewardGen)return;
        rewardShow=null;
        pbtnreward.hidden=true;
        adOfferOpen=false;
        track('ad_dismiss',{breakType:'reward',breakName:'continue-run',reason:'ad'});
      },
      adViewed:()=>{
        rewardShow=null;
        pbtnreward.hidden=true;
        if(gen!==rewardGen)return;
        track('ad_reward',{breakName:'continue-run'});
        reviveRun();
      },
      afterAd:()=>{
        if(gen!==rewardGen)return;
        track('after_ad',{breakType:'reward',breakName:'continue-run'});
      },
      adBreakDone:(info)=>{
        if(gen!==rewardGen)return;
        endAdHold();
        finishShownAd();
        adBreakBusy=false;
        track('ad_break_done',placementProps(info,'reward','continue-run'));
      }
    });
  }catch(e){adBreakBusy=false;}
}
function reviveRun(){
  if(!grid)return;
  clearAdLeave();
  state='playing';
  deathT=0;
  deathPanelShown=false;
  hidePanel();
  pbtnreward.hidden=true;
  const len=Math.min(Math.max(snake?snake.length:OPEN_LEN,OPEN_LEN),10);
  const cells=openSnake(len);
  if(level===1)carveOpen(cells);
  else{
    for(const s of cells){
      for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
        const nx=s.x+dx,ny=s.y+dy;
        if(nx>0&&ny>0&&nx<COLS-1&&ny<ROWS-1)grid[idx(nx,ny)].wall=false;
      }
    }
    const head=cells[0];
    for(let x=head.x;x<Math.min(COLS-1,head.x+OPEN_CLEAR);x++)grid[idx(x,head.y)].wall=false;
  }
  snake=cells.map(c=>({x:c.x,y:c.y}));
  dir={x:1,y:0};
  dirQueue=[];
  flashes=3;
  updateFlashHUD('recharge');
  flash(true);
  tone(440,880,0.2,'triangle',0.08);
}

const idx=(x,y)=>y*COLS+x;
const inB=(x,y)=>x>=0&&y>=0&&x<COLS&&y<ROWS;
const isSnakeCell=(x,y)=>snake.some(s=>s.x===x&&s.y===y);

let actx=null;
function initAudio(){
  if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  if(actx&&actx.state==='suspended')actx.resume();
}
function tone(f0,f1,dur,type,vol,delay=0){
  if(!actx||muted||adHold)return;
  const t=actx.currentTime+delay;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type;
  o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
  g.gain.setValueAtTime(vol,t);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(actx.destination);
  o.start(t);o.stop(t+dur+0.03);
}

function computeReachable(sx,sy){
  const seen=new Set([idx(sx,sy)]),q=[[sx,sy]];
  while(q.length){
    const [x,y]=q.shift();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx,ny=y+dy,i=idx(nx,ny);
      if(inB(nx,ny)&&!grid[i].wall&&!seen.has(i)){seen.add(i);q.push([nx,ny]);}
    }
  }
  return seen;
}

// Length 5 on an 18x18 board with a walled border. The interior is 16 cells
// across, so the body cannot sit 10 from every wall. Centering it puts the
// tail 6 from the left border and the head 7 from the right — 6 is the most
// every segment can have. Level 1 removes any interior wall closer than the
// border already is, and leaves the opening heading clear to that border.
const OPEN_LEN=5;
const OPEN_CLEAR=6;
function openSnake(len){
  const y=Math.floor((ROWS-1)/2);
  let tail=Math.floor((COLS-len)/2);
  if(tail<1)tail=1;
  let head=tail+len-1;
  if(head>COLS-2){head=COLS-2;tail=head-(len-1);}
  const cells=[];
  for(let i=0;i<len;i++)cells.push({x:head-i,y});
  return cells;
}
function borderClear(x,y){return Math.min(x,y,COLS-1-x,ROWS-1-y);}
function carveOpen(cells){
  for(let y=1;y<ROWS-1;y++)for(let x=1;x<COLS-1;x++){
    for(const s of cells){
      if(Math.max(Math.abs(x-s.x),Math.abs(y-s.y))<borderClear(s.x,s.y)){
        grid[idx(x,y)].wall=false;
        break;
      }
    }
  }
  const head=cells[0];
  for(let x=head.x+1;x<COLS-1;x++)grid[idx(x,head.y)].wall=false;
}
function genMaze(){
  const cells=openSnake(OPEN_LEN);
  const head=cells[0];
  for(let attempt=0;attempt<6;attempt++){
    grid=[];
    for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)
      grid.push({wall:x===0||y===0||x===COLS-1||y===ROWS-1,reveal:0,seen:false});
    const runs=6+Math.min(level,8);
    const half=Math.max(1,Math.floor((COLS-2)/2));
    for(let i=0;i<runs;i++){
      let x=1+Math.floor(Math.random()*half),y=1+Math.floor(Math.random()*(ROWS-2));
      const horiz=Math.random()<0.5;
      const len=3+Math.floor(Math.random()*5);
      for(let j=0;j<len;j++){
        const mx=COLS-1-x;
        if(x>0&&x<COLS-1&&y>0&&y<ROWS-1)grid[idx(x,y)].wall=true;
        if(mx>0&&mx<COLS-1&&y>0&&y<ROWS-1)grid[idx(mx,y)].wall=true;
        if(horiz)x++;else y++;
      }
    }
    carveOpen(cells);
    const R=computeReachable(head.x,head.y);
    for(let i=0;i<grid.length;i++)if(!grid[i].wall&&!R.has(i))grid[i].wall=true;
    if(R.size>(COLS-2)*(ROWS-2)*0.35)break;
  }
  snake=cells.map(c=>({x:c.x,y:c.y}));
  dir={x:1,y:0};dirQueue=[];
}

function spawnFood(R){
  if(!R)R=computeReachable(snake[0].x,snake[0].y);
  const head=snake[0],cands=[];
  for(const i of R){
    if(grid[i].wall)continue;
    const x=i%COLS,y=Math.floor(i/COLS);
    if(!isSnakeCell(x,y)&&Math.max(Math.abs(x-head.x),Math.abs(y-head.y))>3)cands.push({x,y});
  }
  if(!cands.length)for(let i=0;i<grid.length;i++){
    const x=i%COLS,y=Math.floor(i/COLS);
    if(!grid[i].wall&&!isSnakeCell(x,y))cands.push({x,y});
  }
  food=cands.length?cands[Math.floor(Math.random()*cands.length)]:null;
}

function addWalls(){
  const head=snake[0];
  let wallCount=grid.reduce((n,c)=>n+(c.wall?1:0),0);
  const canPlace=(x,y)=>{
    if(x<1||y<1||x>=COLS-1||y>=ROWS-1)return false;
    const mx=COLS-1-x;
    if(isSnakeCell(x,y)||isSnakeCell(mx,y))return false;
    if(food&&((food.x===x&&food.y===y)||(food.x===mx&&food.y===y)))return false;
    if(Math.max(Math.abs(x-head.x),Math.abs(y-head.y))<=2)return false;
    if(Math.max(Math.abs(mx-head.x),Math.abs(y-head.y))<=2)return false;
    return !grid[idx(x,y)].wall&&!grid[idx(mx,y)].wall;
  };
  const place=(x,y)=>{
    const mx=COLS-1-x;
    grid[idx(x,y)].wall=true;
    grid[idx(mx,y)].wall=true;
    wallCount+=mx===x?1:2;
  };
  // Short mirrored strokes. The count climbs with level, and placement
  // still stops once half the board is wall.
  const runs=2+Math.min(Math.floor(level/2),5);
  for(let i=0;i<runs;i++){
    let x=1+Math.floor(Math.random()*(COLS-2)),y=1+Math.floor(Math.random()*(ROWS-2));
    const d=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(Math.random()*4)];
    const len=1+Math.floor(Math.random()*2);
    for(let j=0;j<len;j++){
      if(wallCount<COLS*ROWS*0.5&&canPlace(x,y))place(x,y);
      x+=d[0];y+=d[1];
    }
  }
  const R=computeReachable(head.x,head.y);
  for(let i=0;i<grid.length;i++){
    if(!grid[i].wall&&!R.has(i)){
      const x=i%COLS,y=Math.floor(i/COLS);
      if(!isSnakeCell(x,y)&&!(food&&food.x===x&&food.y===y))grid[i].wall=true;
    }
  }
  // The beacon just eaten is still on the head. A reachable cell is not a live
  // pickup while the body covers it — the tail takes a few seconds to slide off.
  if(!food||isSnakeCell(food.x,food.y)||!R.has(idx(food.x,food.y)))spawnFood(R);
}

function pingNote(text){

}
function updateFlashHUD(kind){
  let filled=0;
  [...flashdots.children].forEach((pip,i)=>{
    const on=i<flashes;
    const was=pip.classList.contains('on');
    pip.classList.toggle('on',on);
    pip.classList.remove('spent','recharge');
    if(kind==='spend'&&was&&!on){
      pip.style.animation='none';
      void pip.offsetWidth;
      pip.classList.add('spent');
      pip.style.animation='pipSpent .42s ease';
    }
    if(kind==='recharge'&&on&&!was){
      filled++;
      pip.style.animation='none';
      void pip.offsetWidth;
      pip.classList.add('recharge');
      pip.style.animation=`pipReady .7s ease ${i*0.12}s both`;
    }
  });
  flashdots.setAttribute('aria-label',flashes+' pings ready');
  if(kind==='spend'){
    pingmeter.classList.remove('fired','denied');
    void pingmeter.offsetWidth;
    pingmeter.classList.add('fired');
    firePulse=0.55;
  }
  if(kind==='recharge'&&filled){
    pingmeter.classList.remove('fired');
    pingNote('ready');
    pingBanner={text:'PINGS READY',t:1.15,max:1.15};
  }
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function clipTag(raw){return String(raw||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3);}

function flash(free){
  if(state!=='playing'||!grid)return;
  if(!free){
    if(flashes<=0){
      if(runStats)runStats.emptyPings++;
      tone(220,180,0.12,'square',0.06);
      pingmeter.classList.remove('denied');
      void pingmeter.offsetWidth;
      pingmeter.classList.add('denied');
      pingNote('empty');
      return;
    }
    flashes--;
    updateFlashHUD('spend');
    if(runStats)runStats.pingsUsed++;
  }
  for(const c of grid)c.reveal=1;
  flashHold=0.55;
  const h=snake[0];
  pings.push({x:(h.x+0.5)*CELL,y:(h.y+0.5)*CELL,r:0,rPrev:0,maxR:32*CELL,speed:1500,power:free?0:1});
  tone(900,180,0.6,'sine',0.14);
  tone(1800,240,0.5,'sine',0.06,0.05);
}

function beginRun(){
  clearAdLeave();
  score=0;level=1;foods=0;moveInterval=260;moveAcc=0;
  flashes=3;flashHold=0;

  genMaze();spawnFood();

function newGame(){

}

function levelUp(){
  level++;levelEl.textContent=level;
  track('level_up',{level});
  addWalls();
  // Run start zeros this clock so the beacon blinks immediately. A level change
  // used to leave it mid-cycle, so the new pickup stayed dark for up to a few seconds.
  beaconT=0;
  moveInterval=Math.max(150,moveInterval-8);
  flashT=0.9;
  flashes=3;updateFlashHUD('recharge');
  flash(true);
  tone(440,440,0.08,'square',0.09,0);
  tone(587,587,0.08,'square',0.09,0.09);
  tone(880,880,0.14,'square',0.09,0.18);
}

function die(cause,deathX,deathY){
  state='dead';deathT=0;
  for(const c of grid){c.reveal=1;c.seen=true;}
  shakeT=shakeMax=0.5;shakeAmp=9;
  lastRunEndT=Date.now();
  const played=runStats?Math.max(0,lastRunEndT-runStats.startT-adHoldAccum):0;
  if(runStats)track('run_end',{cause,score,level,foods,pingsUsed:runStats.pingsUsed,emptyPings:runStats.emptyPings,
    firstFoodMs:runStats.firstFoodMs,seconds:Math.round(played/100)/10,deathX,deathY});
  if(score>best){
    best=score;localStorage.setItem('sonarsnake_best',best);
    bestEl.textContent=best;
  }
  tone(150,38,0.7,'sawtooth',0.16);
}

function step(){
  if(dirQueue.length)dir=dirQueue.shift();
  const h=snake[0],nx=h.x+dir.x,ny=h.y+dir.y;
  if(!inB(nx,ny)||grid[idx(nx,ny)].wall){die('wall',nx,ny);return;}
  const eating=food&&food.x===nx&&food.y===ny;
  if(!eating)snake.pop();
  if(snake.some(s=>s.x===nx&&s.y===ny)){die('self',nx,ny);return;}
  snake.unshift({x:nx,y:ny});
  if(eating){
    score+=10+level*2;foods++;
    if(runStats&&runStats.firstFoodMs===null)runStats.firstFoodMs=Date.now()-runStats.startT;
    scoreEl.textContent=score;
    if(score>best){
      best=score;localStorage.setItem('sonarsnake_best',best);
      bestEl.textContent=best;
    }
    for(const c of grid)c.reveal=1;
    flashHold=0.4;
    pings.push({x:(nx+0.5)*CELL,y:(ny+0.5)*CELL,r:0,rPrev:0,maxR:3*CELL,speed:300});
    shakeT=shakeMax=0.12;shakeAmp=3;
    tone(520,780,0.09,'square',0.07);
    if(foods%5===0)levelUp();
    else{moveInterval=Math.max(150,moveInterval-1.5);spawnFood();}
  }
}

function update(dt){
  if(adHold)return;
  tGlobal+=dt;beaconT+=dt;
  if(shakeT>0)shakeT=Math.max(0,shakeT-dt);
  if(flashT>0)flashT=Math.max(0,flashT-dt);
  if(firePulse>0)firePulse=Math.max(0,firePulse-dt);
  if(pingBanner){pingBanner.t-=dt;if(pingBanner.t<=0)pingBanner=null;}
  if(state==='playing'){
    moveAcc+=dt*1000;
    while(moveAcc>=moveInterval&&state==='playing'){moveAcc-=moveInterval;step();}
  }else if(state==='dead'){
    deathT+=dt;
    if(score>0&&!submitted&&!deathPanelShown&&deathT>0.8){deathPanelShown=true;showPanel(true,'death');offerContinueAd();}
  }
  if(grid){
    if(state==='playing'){
      if(flashHold>0)flashHold-=dt;
      else for(const c of grid)if(c.reveal>0)c.reveal=Math.max(0,c.reveal-1.1*dt);
    }
    for(const p of pings){
      p.rPrev=p.r;p.r+=p.speed*dt;
      const r2=p.r*p.r,rp2=p.rPrev*p.rPrev;
      for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
        const dx=(x+0.5)*CELL-p.x,dy=(y+0.5)*CELL-p.y,d=dx*dx+dy*dy;
        if(d<=r2&&d>rp2){const c=grid[idx(x,y)];c.reveal=1;c.seen=true;}
      }
    }
    pings=pings.filter(p=>p.r<p.maxR);
  }
}

function cellBright(x,y){
  const c=grid[idx(x,y)];
  let b=c.reveal;
  if(state==='playing'&&snake){
    const h=snake[0],d=Math.hypot(x-h.x,y-h.y);
    if(d<3.0)b=Math.max(b,1-d/3.0);
  }
  return b;
}
function rrect(x,y,w,h,r){
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
  else ctx.fillRect(x,y,w,h);
}

function drawCells(){
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){
    const c=grid[idx(x,y)];
    if(!c.wall)continue;
    const b=cellBright(x,y);
    if(b<0.03)continue;
    ctx.fillStyle=`rgba(72,214,190,${(b*0.8).toFixed(3)})`;
    rrect(x*CELL+2*U,y*CELL+2*U,CELL-4*U,CELL-4*U,4*U);
    if(b>0.35){
      ctx.fillStyle=`rgba(180,255,240,${(b*0.5).toFixed(3)})`;
      rrect(x*CELL+7*U,y*CELL+7*U,CELL-14*U,CELL-14*U,3*U);
    }
  }
}

function drawFood(){
  const phase=beaconT%3.0;
  const blink=phase<0.5?1-phase/0.5:0;
  const b=Math.max(cellBright(food.x,food.y),blink);
  const cx=(food.x+0.5)*CELL,cy=(food.y+0.5)*CELL;
  const pulse=0.7+0.3*Math.sin(tGlobal*6);
  ctx.fillStyle=`rgba(255,196,90,${(b*pulse).toFixed(3)})`;
  ctx.beginPath();ctx.arc(cx,cy,CELL*0.28,0,Math.PI*2);ctx.fill();
  if(b>0.3){
    ctx.fillStyle=`rgba(255,230,160,${(b*0.5).toFixed(3)})`;
    ctx.beginPath();ctx.arc(cx,cy,CELL*0.12,0,Math.PI*2);ctx.fill();
  }
  if(phase<1.4){
    const rp=phase/1.4;
    ctx.strokeStyle=`rgba(255,196,90,${((1-rp)*0.4).toFixed(3)})`;
    ctx.lineWidth=1.5;
    ctx.beginPath();ctx.arc(cx,cy,rp*4.5*CELL,0,Math.PI*2);ctx.stroke();
  }
  const arrow=phase<1.2?1-phase/1.2:0;
  if(arrow>0&&state==='playing'&&snake){
    const h=snake[0],hx=(h.x+0.5)*CELL,hy=(h.y+0.5)*CELL;
    const ang=Math.atan2(cy-hy,cx-hx);
    ctx.save();
    ctx.translate(hx+Math.cos(ang)*38*U,hy+Math.sin(ang)*38*U);
    ctx.rotate(ang);
    ctx.fillStyle=`rgba(255,196,90,${(arrow*0.85).toFixed(3)})`;
    ctx.beginPath();ctx.moveTo(9*U,0);ctx.lineTo(-6*U,-6*U);ctx.lineTo(-6*U,6*U);ctx.closePath();ctx.fill();
    ctx.restore();
  }
}

function drawSnake(){
  const dead=state==='dead';
  for(let i=snake.length-1;i>=0;i--){
    const s=snake[i],t=i/Math.max(1,snake.length-1);
    const hue=dead?8:168+t*44,light=dead?50-20*t:62-26*t;
    ctx.fillStyle=`hsl(${hue.toFixed(0)} 80% ${light.toFixed(0)}%)`;
    rrect(s.x*CELL+2*U,s.y*CELL+2*U,CELL-4*U,CELL-4*U,7*U);
  }
  const h=snake[0],ex=(h.x+0.5)*CELL,ey=(h.y+0.5)*CELL;
  const fx=dir.x*4*U,fy=dir.y*4*U,sx=-dir.y*4*U,sy=dir.x*4*U;
  ctx.fillStyle='#04070d';
  ctx.beginPath();ctx.arc(ex+fx+sx,ey+fy+sy,2.4*U,0,Math.PI*2);ctx.fill();
  ctx.beginPath();ctx.arc(ex+fx-sx,ey+fy-sy,2.4*U,0,Math.PI*2);ctx.fill();
}

function drawPings(){
  for(const p of pings){
    const a=Math.max(0,1-p.r/p.maxR);
    const boost=p.power?1:0;
    ctx.strokeStyle=`rgba(${boost?220:160},${boost?255:225},255,${(a*(boost?0.95:0.6)).toFixed(3)})`;
    ctx.lineWidth=(boost?6:2)*U;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.stroke();
    if(p.r>14*U){
      ctx.strokeStyle=`rgba(160,225,255,${(a*(boost?0.45:0.25)).toFixed(3)})`;
      ctx.lineWidth=(boost?3:1)*U;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r*0.82,0,Math.PI*2);ctx.stroke();
    }
  }
}
function drawFirePulse(){
  if(firePulse<=0||!snake)return;
  const a=firePulse/0.55;
  const h=snake[0],hx=(h.x+0.5)*CELL,hy=(h.y+0.5)*CELL,rad=CELL*(2+(1-a)*7);
  const g=ctx.createRadialGradient(hx,hy,CELL*0.4,hx,hy,rad);
  g.addColorStop(0,`rgba(230,255,252,${(a*0.55).toFixed(3)})`);
  g.addColorStop(0.45,`rgba(120,240,220,${(a*0.2).toFixed(3)})`);
  g.addColorStop(1,'rgba(80,200,190,0)');
  ctx.fillStyle=g;
  ctx.beginPath();ctx.arc(hx,hy,rad,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=`rgba(230,255,250,${(a*0.95).toFixed(3)})`;
  ctx.lineWidth=4*U*(0.45+a);
  ctx.beginPath();ctx.arc(hx,hy,CELL*(1.2+(1-a)*5),0,Math.PI*2);ctx.stroke();
}
function drawPingBanner(){
  if(!pingBanner||state!=='playing')return;

function drawDead(){
  ctx.textAlign='center';
  const hasLS='letterSpacing'in ctx;
  if(hasLS)ctx.letterSpacing='8px';
  ctx.fillStyle='#ff7a70';
  ctx.font='bold 44px ui-monospace,Menlo,monospace';
  ctx.fillText('GAME OVER',cv.width/2+4,cv.height/2-36);
  if(hasLS)ctx.letterSpacing='0px';
  ctx.fillStyle='#cfe8e2';ctx.font=`${fs(16)}px ui-monospace,monospace`;
  ctx.fillText(`score ${score}   ·   best ${best}   ·   level ${level}`,cv.width/2,cv.height/2+8);
  if(deathT>0.6){
    const touch=matchMedia('(pointer:coarse)').matches;
    ctx.fillStyle=`rgba(230,255,250,${(0.5+0.5*Math.sin(tGlobal*3)).toFixed(3)})`;
    ctx.font=`${fs(15)}px ui-monospace,monospace`;
    ctx.fillText(touch?'tap to dive again':'press R to dive again',cv.width/2,cv.height/2+52);
  }
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.fillStyle='#04070d';
  ctx.fillRect(0,0,cv.width,cv.height);
  let ox=0,oy=0;
  if(shakeT>0){
    const a=shakeAmp*(shakeT/shakeMax);
    ox=(Math.random()*2-1)*a;oy=(Math.random()*2-1)*a;
  }
  ctx.translate(ox,oy);
  ctx.fillStyle='rgba(130,220,255,0.045)';
  for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)
    ctx.fillRect(x*CELL+CELL/2-U,y*CELL+CELL/2-U,2*U,2*U);
  if(grid)drawCells();
  if(food&&grid&&state!=='title')drawFood();
  if(snake&&(state==='playing'||state==='dead'))drawSnake();
  drawPings();
  drawFirePulse();
  ctx.setTransform(1,0,0,1,0,0);
  if(state==='title')drawTitle();
  if(state==='dead')drawDead();
  drawPingBanner();
  if(flashT>0){
    ctx.fillStyle=`rgba(120,255,220,${(flashT*0.35).toFixed(3)})`;
    ctx.fillRect(0,0,cv.width,cv.height);
  }
  if(state==='dead'&&deathT<0.5){
    ctx.fillStyle=`rgba(255,50,50,${((0.5-deathT)*0.5).toFixed(3)})`;
    ctx.fillRect(0,0,cv.width,cv.height);
  }
}

const KEYDIRS={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],
               w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],
               W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]};
function queueDir(d){
  const last=dirQueue.length?dirQueue[dirQueue.length-1]:dir;
  if(d[0]===-last.x&&d[1]===-last.y)return;
  if(d[0]===last.x&&d[1]===last.y)return;
  if(dirQueue.length<3)dirQueue.push({x:d[0],y:d[1]});
}

window.addEventListener('keydown',e=>{
  initAudio();
  const ae=document.activeElement;
  if(ae&&ae.tagName==='INPUT'){
    if(e.key==='Escape'){lname.blur();hidePanel();}
    return;
  }
  const k=e.key;
  if(adHold){if(k===' '||KEYDIRS[k])e.preventDefault();return;}
  if(k===' '||KEYDIRS[k])e.preventDefault();
  if(k==='m'||k==='M'){setMuted(!muted);return;}
  if(!panel.hidden&&(k==='l'||k==='L'||k==='Escape')){hidePanel();return;}
  if((k==='l'||k==='L')&&(state==='title'||state==='dead')){
    showPanel(state==='dead'&&!submitted&&score>0);
    return;
  }
  if(state==='title'){if(!panel.hidden)return;newGame();if(KEYDIRS[k])queueDir(KEYDIRS[k]);return;}
  if(state==='dead'){
    if(deathT>0.5&&(k==='r'||k==='R'||k==='Enter'||k===' '))newGame();
    return;
  }
  if(k===' '){flash(false);return;}
  if(KEYDIRS[k])queueDir(KEYDIRS[k]);
});

document.addEventListener('touchmove',e=>{
  if(e.target!==cv&&!panel.contains(e.target))e.preventDefault();
},{passive:false});

let touchStart=null;
function pressAction(){
  if(adHold)return;
  if(state==='title')newGame();
  else if(state==='dead'&&deathT>0.5)newGame();
  else if(state==='playing')flash(false);
}
cv.addEventListener('pointerdown',e=>{
  if(adHold)return;
  initAudio();
  if(e.pointerType==='touch'){
    touchStart={x:e.clientX,y:e.clientY,dragged:false};
    try{cv.setPointerCapture(e.pointerId);}catch(err){}
  }
  else pressAction();
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType!=='touch'||!touchStart||state!=='playing')return;
  const dx=e.clientX-touchStart.x,dy=e.clientY-touchStart.y;
  if(Math.hypot(dx,dy)>=18){
    const d=Math.abs(dx)>Math.abs(dy)?[Math.sign(dx),0]:[0,Math.sign(dy)];
    queueDir(d);
    touchStart.dragged=true;
    touchStart={x:e.clientX,y:e.clientY,dragged:true};
  }
});
cv.addEventListener('pointerup',e=>{
  if(e.pointerType!=='touch'||!touchStart)return;
  const wasDrag=touchStart.dragged;
  touchStart=null;
  if(!wasDrag)pressAction();
});

let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);
  last=now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
